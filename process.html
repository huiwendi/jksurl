<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 처리 데스크</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f0f2f5;color:#333}
.top-bar{background:#16324f;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-bar h1{font-size:18px;white-space:nowrap}
.top-bar .sub{font-size:11px;opacity:.65}
.top-bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.14);border-radius:16px;padding:6px 12px;font-size:12px;color:#fff;text-decoration:none;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.26)}
.container{max-width:1200px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid #e3e8ee;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;color:#556;cursor:pointer}
.tab.active{background:#16324f;border-color:#16324f;color:#fff}
.tab .n{opacity:.75;font-weight:500;margin-left:4px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .hint{font-size:12px;color:#8899aa}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-primary{background:#2d6a9f;color:#fff}.btn-primary:hover{background:#1e3a5f}
.btn-green{background:#27ae60;color:#fff}.btn-green:hover{background:#219150}
.btn-gray{background:#eef2f6;color:#44566c}.btn-gray:hover{background:#e2e8f0}
.btn-danger{background:#fdecec;color:#c0392b}.btn-danger:hover{background:#fbdcdc}
.btn:disabled{opacity:.5;cursor:not-allowed}

.ord{background:#fff;border:1px solid #e8edf3;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ord.new{border-left:4px solid #2d6a9f}
.ord.done{border-left:4px solid #27ae60;opacity:.92}
.ord.cancel{border-left:4px solid #e74c3c;opacity:.8}
.o-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.o-no{font-family:Consolas,Menlo,monospace;font-size:15px;font-weight:800;color:#16324f}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px}
.b-sent{background:#e0ecff;color:#1d4ed8}
.b-rev{background:#fff3cd;color:#b45309}
.b-done{background:#dcfce7;color:#15803d}
.b-cancel{background:#fee2e2;color:#b91c1c}
.b-edit{background:#fff3cd;color:#b45309}
.o-meta{font-size:12px;color:#778;line-height:1.8}
.o-meta b{color:#e74c3c}
.o-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{background:#fff;border:1px dashed #dfe6ee;border-radius:10px;padding:50px 20px;text-align:center;color:#9aa;font-size:13px}
.empty .icon{font-size:40px;margin-bottom:8px}
.loading{text-align:center;color:#99a;padding:40px;font-size:13px}
.spin{width:26px;height:26px;border:3px solid #eee;border-top-color:#2d6a9f;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow-y:auto;padding:20px}
.mask.active{display:block}
.modal{background:#fff;border-radius:14px;max-width:640px;margin:20px auto;padding:22px;position:relative}
.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:24px;color:#999;cursor:pointer}
.modal h3{font-size:15px;color:#16324f;margin-bottom:10px}
table.m{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
table.m th{background:#f7f8fa;text-align:left;padding:7px 8px;color:#667;font-weight:600}
table.m td{padding:7px 8px;border-bottom:1px solid #eef1f4}
table.m td.num,table.m th.num{text-align:right}
/* 상품 이미지 (피킹/검수 대조용) */
.it-cell{display:flex;align-items:center;gap:9px}
.it-thumb{width:46px;height:46px;flex:0 0 46px;border-radius:7px;background:#fafafa;border:1px solid #eef1f4;display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none}
.it-thumb .it-img{width:100%;height:100%;object-fit:contain;display:none;background:#fff}
.it-thumb.ok .it-img{display:block}
.it-thumb.ok .it-ph{display:none}
.it-thumb .it-ph{font-size:17px;color:#dfe6ee;line-height:1}
.it-thumb[href]{cursor:zoom-in}
.it-name{font-size:12.5px;line-height:1.45;word-break:keep-all}
.it-opt{font-size:11px;color:#888;margin-top:2px}
.it-code{font-size:10px;color:#b0bcc8;margin-top:1px;font-family:Consolas,Menlo,monospace}
.it-note{font-size:11px;color:#9aa;margin:-2px 0 10px}
.m-total{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:#e74c3c;margin:10px 0}
.m-info{background:#f7f8fa;border-radius:8px;padding:10px 12px;font-size:12px;color:#556;line-height:1.9}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.m-actions .btn{flex:1;min-width:110px;padding:11px}

.setup{max-width:520px;margin:80px auto;background:#fff;border-radius:14px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.setup h2{font-size:18px;color:#16324f;margin-bottom:8px}
.setup p{font-size:13px;color:#777;line-height:1.8;margin-bottom:14px}
.setup input{width:100%;padding:12px 14px;border:2px solid #e0e6ec;border-radius:9px;font-size:13px;outline:none;margin-bottom:10px}
.setup input:focus{border-color:#2d6a9f}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;display:none}
.toast.show{display:block}
@media(max-width:700px){.container{padding:12px}.o-no{font-size:14px}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🧾 주문 처리 데스크</h1>
  <span class="sub">로그인 없이 바로 처리 · 주문 확인 → 처리완료 → 엑셀 다운로드</span>
  <div class="right">
    <span class="pill" id="whoami">—</span>
    <a class="pill" href="#" onclick="refreshAll();return false">🔄 새로고침</a>
    <a class="pill" id="adminLink" href="admin.html" target="_blank">⚙️ 관리자</a>
  </div>
</div>

<div class="container" id="main">
  <div class="tabs">
    <button class="tab active" data-tab="pending" onclick="switchTab('pending')">⏳ 처리 대기 <span class="n" id="nPending"></span></button>
    <button class="tab" data-tab="done" onclick="switchTab('done')">✅ 처리완료 <span class="n" id="nDone"></span></button>
    <button class="tab" data-tab="cancel" onclick="switchTab('cancel')">🚫 취소 <span class="n" id="nCancel"></span></button>
  </div>
  <div class="toolbar">
    <button class="btn btn-gray" onclick="downloadAllMatch()">📦 전체 매칭표</button>
    <span class="hint" id="hint">불러오는 중...</span>
  </div>
  <div id="list"><div class="loading"><div class="spin"></div>불러오는 중...</div></div>
</div>

<div class="mask" id="detailMask">
  <div class="modal">
    <button class="modal-close" onclick="closeMask('detailMask')">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api-client.js"></script>
<script src="product-images.js?v=20261111"></script>
<script src="matching.js?v=20261109"></script>
<script>
var tab = 'pending';
var allOrders = [];
var busy = false;
var timer = null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){return (Number(n)||0).toLocaleString();}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2600);}
function closeMask(id){document.getElementById(id).classList.remove('active');}

function showSetup(msg) {
  document.getElementById('main').innerHTML =
    '<div class="setup">' +
      '<h2>🔑 처리 데스크 링크가 필요합니다</h2>' +
      '<p>관리자 페이지에서 만든 <b>免로그인 링크</b>를 붙여넣으세요.<br>(한 번 넣으면 이 컴퓨터에 저장됩니다)</p>' +
      '<input id="linkInput" placeholder="https://huiwendi.github.io/jksurl/process.html?k=... 또는 k 값만">' +
      '<button class="btn btn-primary" style="width:100%;padding:12px" onclick="saveLink()">저장하고 열기</button>' +
      '<p style="margin-top:12px;color:#c0392b" id="setupErr">' + esc(msg || '') + '</p>' +
      '<p style="margin-top:10px;font-size:12px;color:#9aa">관리자 페이지 →「🔑 免로그인 링크」에서 복사할 수 있습니다.</p>' +
    '</div>';
}

function saveLink() {
  var v = document.getElementById('linkInput').value.trim();
  if (!v) return;
  var k = v;
  try { var u = new URL(v); k = u.searchParams.get('k') || v; } catch(e) {}
  ApiClient.setAlink(k);
  location.reload();
}

function switchTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-tab') === t); });
  render();
}

function classify(o) {
  if (o.status === '취소') return 'cancel';
  if (o.status === '처리완료') return 'done';
  return 'pending';
}

function badgeFor(o) {
  if (o.status === '수정중') return '<span class="badge b-edit">수정중</span>';
  if (o.status === '발송됨' && o.revision > 0) return '<span class="badge b-rev">수정 검토 필요 · ' + o.revision + '차</span>';
  if (o.status === '발송됨') return '<span class="badge b-sent">발송됨</span>';
  if (o.status === '처리완료') return '<span class="badge b-done">처리완료</span>';
  if (o.status === '취소') return '<span class="badge b-cancel">취소</span>';
  return '<span class="badge b-sent">' + esc(o.status) + '</span>';
}

function render() {
  var groups = { pending: [], done: [], cancel: [] };
  allOrders.forEach(function(o) { groups[classify(o)].push(o); });
  document.getElementById('nPending').textContent = groups.pending.length ? '(' + groups.pending.length + ')' : '';
  document.getElementById('nDone').textContent = groups.done.length ? '(' + groups.done.length + ')' : '';
  document.getElementById('nCancel').textContent = groups.cancel.length ? '(' + groups.cancel.length + ')' : '';
  document.getElementById('hint').textContent = '총 ' + allOrders.length + '건 · ' + new Date().toLocaleTimeString('ko-KR');

  var list = groups[tab] || [];
  var box = document.getElementById('list');
  if (!list.length) {
    box.innerHTML = '<div class="empty"><div class="icon">📭</div>' + (tab === 'pending' ? '처리할 주문이 없습니다.' : '해당 주문이 없습니다.') + '</div>';
    return;
  }
  box.innerHTML = list.map(function(o) {
    var cls = o.status === '처리완료' ? 'done' : (o.status === '취소' ? 'cancel' : 'new');
    var acts = [];
    if (o.status === '처리완료') {
      acts.push('<button class="btn btn-gray" data-act="undo" data-no="' + esc(o.orderNo) + '">↩️ 되돌리기</button>');
    } else if (o.status !== '취소') {
      acts.push('<button class="btn btn-green" data-act="done" data-no="' + esc(o.orderNo) + '">✅ 처리완료</button>');
    }
    acts.push('<button class="btn btn-primary" data-act="xls" data-no="' + esc(o.orderNo) + '">📥 엑셀 다운로드</button>');
    acts.push('<button class="btn btn-gray" data-act="match" data-no="' + esc(o.orderNo) + '">🔗 매칭표</button>');
    acts.push('<button class="btn btn-danger" data-act="del" data-no="' + esc(o.orderNo) + '" title="주문 삭제">🗑 삭제</button>');
    acts.push('<button class="btn btn-gray" data-act="detail" data-no="' + esc(o.orderNo) + '">상세</button>');
    return '<div class="ord ' + cls + '">' +
      '<div class="o-top"><span class="o-no">' + esc(o.orderNo) + '</span>' + badgeFor(o) + '</div>' +
      '<div class="o-meta">' +
        '고객 <b style="color:#16324f">' + esc(o.customerName) + '</b>' +
        ' · 접수 ' + esc(o.createdAt) +
        (o.sentAt ? ' · 발송 ' + esc(o.sentAt) : '') +
        '<br>' + (o.itemCount || 0) + '종 / ' + (o.totalQty || 0) + '개 · 합계 <b>' + money(o.totalAmount) + '원</b>' +
      '</div>' +
      '<div class="o-act">' + acts.join('') + '</div>' +
    '</div>';
  }).join('');
}

async function loadOrders() {
  var res = await ApiClient.admin.orders();
  if (!res || !res.success) {
    if (res && /인증/.test(res.error || '')) { showSetup('링크가 올바르지 않거나 만료되었습니다.'); return; }
    toast((res && res.error) || '불러오기 실패');
    return;
  }
  allOrders = res.orders || [];
  render();
}

async function refreshAll() {
  try { await loadOrders(); } catch(e) { toast('네트워크 오류: ' + e.message); }
}

async function setStatus(no, status) {
  if (busy) return;
  var msg = status === '처리완료' ? no + ' 주문을 처리완료로 표시할까요?' : no + ' 주문을 되돌릴까요?';
  if (!confirm(msg)) return;
  busy = true;
  var res = await ApiClient.admin.setOrderStatus(no, status);
  busy = false;
  if (res && res.success) { toast('변경되었습니다'); loadOrders(); }
  else toast((res && res.error) || '변경 실패');
}

function orderDate(o) {
  var s = String(o.createdAt || '').slice(0, 10);
  var p = s.split('-');
  if (p.length === 3) return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return new Date();
}

function buildAndDownload(o) {
  var items = o.items || [];
  if (!items.length) { toast('상세 품목이 없어 엑셀을 만들 수 없습니다'); return; }
  if (typeof XLSX === 'undefined') { toast('엑셀 라이브러리를 불러오지 못했습니다 (인터넷 확인)'); return; }

  var cust = o.customer || {};
  var d = orderDate(o);
  var rows = [['주문번호','상품코드/매칭코드','주문일','상품명','옵션','바코드','단가','수량','금액',
               '수령자명','수령자전화번호','수령자핸드폰','수령자우편번호','수령자주소','배송메세지1']];
  items.forEach(function(it) {
    var price = Number(it.price) || 0;
    rows.push([
      o.orderNo, it.skuCode || '', d, it.name || '',
      it.optName || '', it.barcode || '',
      price > 0 ? price : '', it.qty || 0, price > 0 ? price * (it.qty || 0) : '',
      cust.name || '', cust.phone || '', cust.mobile || '', cust.zip || '', cust.address || '', cust.memo || ''
    ]);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:18},{wch:12},{wch:35},{wch:15},{wch:14},{wch:10},{wch:8},{wch:12},
                 {wch:14},{wch:14},{wch:14},{wch:10},{wch:40},{wch:20}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '주문서');
  var safeName = String(cust.name || '주문서').replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, safeName + '_' + o.orderNo + '.xls', { bookType: 'biff8' });
}

async function downloadOrder(no) {
  toast('엑셀 준비 중...');
  var res = await ApiClient.admin.orderDetail(no);
  if (!res || !res.success) { toast((res && res.error) || '불러오기 실패'); return; }
  buildAndDownload(res.order);
}

// ✅ 매칭표(ezadmin 「매칭 일괄등록」용) — 주문 1건 분
//    ezadmin 은 매칭할 때 전각→반각 처리된 옵션 문자열을 쓴다 → Matching.normOpt 가 처리
async function downloadMatch(no) {
  toast('매칭표 준비 중...');
  var res = await ApiClient.admin.orderDetail(no);
  if (!res || !res.success) { toast((res && res.error) || '불러오기 실패'); return; }
  var o = res.order || {};
  var r = Matching.rowsFromItems(o.items || []);
  if (!r.rows.length) { toast('매칭표에 넣을 상품이 없습니다 (무옵션/코드없음)'); return; }
  Matching.download(r.rows, '매칭_' + no + '.xls');
  var extra = [];
  if (r.skipped.noCode) extra.push('코드없음 ' + r.skipped.noCode + '건');
  if (r.skipped.dup) extra.push('중복 ' + r.skipped.dup + '건');
  var note = r.skipped.noOpt ? ' · 무옵션 ' + r.skipped.noOpt + '건은 옵션 빈칸으로 포함' : '';
  toast('매칭표 ' + r.rows.length + '건 다운로드' + (extra.length ? ' (' + extra.join(', ') + ' 제외)' : '') + note);
}

// ✅ 매칭표 — 전체 카탈로그(재고 목록 기준). 새 상품이 생기면 다시 받아 한 번 더 업로드하면 된다.
async function downloadAllMatch() {
  toast('전체 매칭표 준비 중...');
  var res = await ApiClient.inventory.getGroups();
  if (!res || !res.success) { toast((res && res.error) || '재고 목록을 불러오지 못했습니다'); return; }
  var r = Matching.rowsFromCatalog(res.groups || []);
  if (!r.rows.length) { toast('매칭표에 넣을 상품이 없습니다'); return; }
  Matching.download(r.rows, Matching.fileNameFor(''));
  var extra = [];
  if (r.skipped.dup) extra.push('중복 ' + r.skipped.dup + '건');
  var note = r.skipped.noOpt ? ' · 무옵션 ' + r.skipped.noOpt + '건은 옵션 빈칸으로 포함' : '';
  toast('전체 매칭표 ' + r.rows.length + '건 다운로드' + (extra.length ? ' (' + extra.join(', ') + ' 제외)' : '') + note);
}

// ===== 관리자 직접 수정 (품목 삭제/추가/수량) + 주문 삭제 =====
var editOrder = null, editItems = [], invCache = null, pickRows = [], lastPickQuery = '', editBusy = false;

function num(v) { return Number(v) || 0; }
function sumEdit() {
  var qty = 0, amt = 0;
  editItems.forEach(function(it) { qty += num(it.qty); amt += num(it.price) * num(it.qty); });
  return { qty: qty, amount: amt };
}
function backendHint(res) {
  var e = String((res && res.error) || '');
  if (/unknown action/i.test(e)) return '백엔드 업데이트가 필요합니다 — GAS 새 버전(2026-11-09-admin-edit-1) 배포 후 사용하세요';
  return e || '실패';
}

async function showDetail(no) {
  var res = await ApiClient.admin.orderDetail(no);
  if (!res || !res.success) { toast((res && res.error) || '불러오기 실패'); return; }
  editOrder = res.order;
  editItems = (editOrder.items || []).map(function(it) {
    return { name: it.name || '', optName: it.optName || '', barcode: it.barcode || '',
             skuCode: it.skuCode || '', price: num(it.price), qty: num(it.qty) || 1 };
  });
  lastPickQuery = '';
  renderDetail();
  document.getElementById('detailMask').classList.add('active');
  loadInventoryForPicker();
}

function renderDetail() {
  var o = editOrder || {}, cust = o.customer || {};
  var rows = editItems.length ? editItems.map(function(it, idx) {
    return '<tr>' +
      '<td><div class="it-cell">' +
        '<a class="it-thumb" data-bc="' + esc(it.barcode) + '" data-sku="' + esc(it.skuCode) + '"' +
        ' data-name="' + esc(it.name) + '" data-opt="' + esc(ProductImages.normOpt(it.optName)) + '">' +
          '<img class="it-img" alt=""><span class="it-ph">📷</span></a>' +
        '<div class="it-info">' +
          '<div class="it-name">' + esc(it.name) + '</div>' +
          (it.optName ? '<div class="it-opt">' + esc(it.optName) + '</div>' : '') +
          (it.skuCode ? '<div class="it-code">' + esc(it.skuCode) + '</div>' : '') +
        '</div>' +
      '</div></td>' +
      '<td class="num"><input type="number" min="1" max="9999" value="' + num(it.qty) + '" onchange="editQty(' + idx + ',this.value)" ' +
        'style="width:62px;text-align:right;padding:5px;border:1px solid #dfe6ee;border-radius:6px"></td>' +
      '<td class="num" style="white-space:nowrap">' + (num(it.price) ? money(it.price) + '원' : '-') + '</td>' +
      '<td class="num"><button class="btn btn-danger" style="padding:5px 10px" onclick="removeItem(' + idx + ')">✕</button></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="4" style="text-align:center;color:#99a">품목이 없습니다 — 아래에서 추가하세요</td></tr>';

  var t = sumEdit();
  var acts = '<div class="m-actions">';
  if (o.status === '처리완료') acts += '<button class="btn btn-gray" onclick="afterStatus(\'발송됨\')">↩️ 되돌리기</button>';
  else if (o.status !== '취소') acts += '<button class="btn btn-green" onclick="afterStatus(\'처리완료\')">✅ 처리완료</button>';
  acts += '<button class="btn btn-primary" onclick="saveItems()">💾 변경 저장</button>';
  acts += '<button class="btn btn-gray" onclick="downloadOrder(\'' + o.orderNo + '\')">📥 엑셀</button>';
  acts += '<button class="btn btn-gray" onclick="downloadMatch(\'' + o.orderNo + '\')">🔗 매칭표</button>';
  acts += '<button class="btn btn-danger" onclick="deleteOrder(\'' + o.orderNo + '\')">🗑 삭제</button>';
  acts += '<button class="btn btn-gray" onclick="closeMask(\'detailMask\')">닫기</button></div>';

  document.getElementById('detailContent').innerHTML =
    '<h3>' + esc(o.orderNo) + ' ' + badgeFor(o) + '</h3>' +
    '<div class="m-info">고객: <b>' + esc(cust.name || '') + '</b>' + (cust.phone ? ' / ' + esc(cust.phone) : '') +
      '<br>접수: ' + esc(o.createdAt) + (o.sentAt ? ' · 발송: ' + esc(o.sentAt) : '') +
      (o.revision > 0 ? ' · 고객수정 ' + o.revision + '차' : '') +
      (o.adminEdits > 0 ? ' · <b style="color:#b45309">관리자수정 ' + o.adminEdits + '회</b>' : '') +
      (cust.address ? '<br>주소: ' + esc(cust.address) : '') + '</div>' +
    '<table class="m"><thead><tr><th>상품 (수정 가능)</th><th class="num">수량</th><th class="num">단가</th><th class="num"></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="m-total"><span>합계 (' + t.qty + '개)</span><span>' + money(t.amount) + '원</span></div>' +
    '<div style="background:#f7f8fa;border-radius:8px;padding:10px 12px;margin-bottom:4px">' +
      '<div style="font-size:12px;color:#556;margin-bottom:6px"><b>➕ 품목 추가</b> — 상품명 / 옵션 / 바코드 검색</div>' +
      '<input id="prodSearch" placeholder="예: 야광3D눈 22호" oninput="searchProducts(this.value)" value="' + esc(lastPickQuery) + '" ' +
        'style="width:100%;padding:9px 11px;border:1px solid #dfe6ee;border-radius:7px;font-size:12px;outline:none">' +
      '<div id="prodResults" style="max-height:170px;overflow:auto;margin-top:6px"></div>' +
    '</div>' +
    '<div class="it-note">※ 상품 이미지를 누르면 크게 볼 수 있습니다 (검수·피킹 대조용)</div>' + acts;
  if (lastPickQuery) searchProducts(lastPickQuery);
  ProductImages.fill(document.getElementById('detailContent'));
}

function editQty(i, v) {
  if (!editItems[i]) return;
  var q = parseInt(v, 10);
  if (isNaN(q) || q < 1) q = 1;
  if (q > 9999) q = 9999;
  editItems[i].qty = q;
  renderDetail();
}
function removeItem(i) { editItems.splice(i, 1); renderDetail(); }

async function loadInventoryForPicker() {
  if (invCache || loadInventoryForPicker._busy) return;
  loadInventoryForPicker._busy = true;
  try {
    // 이미지 모듈이 받아둔 재고 목록을 그대로 재사용 (같은 600KB 를 두 번 받지 않도록)
    var r = await ProductImages.load();
    if (!r.groups) {
      var again = await ApiClient.inventory.getGroups();
      if (again && again.success) r = ProductImages.prime(again.groups || []);
    }
    var flat = [];
    (r.groups || []).forEach(function(g) {
      (g.options || []).forEach(function(o) {
        flat.push({ name: g.name || '', optName: o.optName || '', price: num(o.price),
                    barcode: o.barcode || '', skuCode: o.skuCode || '' });
      });
    });
    invCache = flat;
    if (lastPickQuery) searchProducts(lastPickQuery);
  } finally { loadInventoryForPicker._busy = false; }
}

function searchProducts(q) {
  lastPickQuery = String(q || '');
  var box = document.getElementById('prodResults');
  if (!box) return;
  if (!invCache) { box.innerHTML = '<div style="font-size:12px;color:#99a;padding:6px">상품 목록 불러오는 중...</div>'; return; }
  var key = lastPickQuery.trim().toLowerCase();
  if (!key) { box.innerHTML = '<div style="font-size:12px;color:#99a;padding:6px">검색어를 입력하세요</div>'; return; }
  var out = [];
  for (var i = 0; i < invCache.length; i++) {
    var it = invCache[i];
    if ((it.name + ' ' + it.optName + ' ' + it.barcode + ' ' + it.skuCode).toLowerCase().indexOf(key) >= 0) {
      out.push(it);
      if (out.length >= 20) break;
    }
  }
  pickRows = out;
  box.innerHTML = out.length ? out.map(function(it, idx) {
    return '<div style="padding:7px 9px;border-bottom:1px solid #eef1f4;cursor:pointer" onclick="addProduct(' + idx + ')">' +
      '<b style="font-size:12px;color:#16324f">' + esc(it.name) + '</b>' +
      '<div style="font-size:11px;color:#778;margin-top:2px">' + esc(it.optName) + ' · ' + esc(it.skuCode) +
      (it.price ? ' · ' + money(it.price) + '원' : '') + '</div></div>';
  }).join('') : '<div style="font-size:12px;color:#c0392b;padding:6px">검색 결과가 없습니다</div>';
}

function addProduct(idx) {
  var it = pickRows[idx];
  if (!it) return;
  var dup = -1;
  for (var i = 0; i < editItems.length; i++) {
    if (String(editItems[i].skuCode) === String(it.skuCode) && String(editItems[i].optName) === String(it.optName)) { dup = i; break; }
  }
  if (dup >= 0) { editItems[dup].qty = num(editItems[dup].qty) + 1; }
  else editItems.push({ name: it.name, optName: it.optName, barcode: it.barcode, skuCode: it.skuCode, price: it.price, qty: 1 });
  renderDetail();
  toast(dup >= 0 ? '수량 +1' : '품목을 추가했습니다');
}

async function saveItems() {
  if (!editOrder || editBusy) return;
  if (!editItems.length) { toast('품목이 비어 있습니다 — 주문 자체를 지우려면 🗑 삭제를 쓰세요'); return; }
  editBusy = true;
  var payload = editItems.map(function(it) {
    return { name: it.name, optName: it.optName, barcode: it.barcode, skuCode: it.skuCode, price: num(it.price), qty: num(it.qty) };
  });
  var res = await ApiClient.admin.setOrderItems(editOrder.orderNo, payload);
  editBusy = false;
  if (res && res.success) {
    editOrder = res.order;
    editItems = (editOrder.items || []).map(function(it) {
      return { name: it.name || '', optName: it.optName || '', barcode: it.barcode || '',
               skuCode: it.skuCode || '', price: num(it.price), qty: num(it.qty) || 1 };
    });
    renderDetail();
    toast('저장되었습니다 — 엑셀을 다시 받아 ezadmin에 다시 올리세요');
    loadOrders();
  } else toast(backendHint(res) || '저장 실패');
}

async function deleteOrder(no) {
  if (!confirm(no + ' 주문을 완전히 삭제할까요?\n\n· 되돌릴 수 없습니다\n· 고객 주문내역에서도 사라집니다')) return;
  var res = await ApiClient.admin.deleteOrder(no);
  if (res && res.success) { closeMask('detailMask'); toast('삭제되었습니다'); loadOrders(); }
  else toast(backendHint(res) || '삭제 실패');
}

function afterStatus(status) {
  var no = editOrder && editOrder.orderNo;
  closeMask('detailMask');
  if (no) setStatus(no, status);
}

document.getElementById('list').addEventListener('click', function(e) {
  var b = e.target.closest('button[data-act]');
  if (!b) return;
  var no = b.getAttribute('data-no');
  var act = b.getAttribute('data-act');
  if (act === 'done') setStatus(no, '처리완료');
  else if (act === 'undo') setStatus(no, '발송됨');
  else if (act === 'xls') downloadOrder(no);
  else if (act === 'match') downloadMatch(no);
  else if (act === 'del') deleteOrder(no);
  else if (act === 'detail') showDetail(no);
});

(async function init() {
  if (!ApiClient.getUrl()) ApiClient.init();
  if (!ApiClient.getAlink()) { showSetup(''); return; }
  document.getElementById('adminLink').href = 'admin.html?k=' + ApiClient.getAlink();
  document.getElementById('whoami').textContent = '🔓 免로그인 모드';
  await loadOrders();
  timer = setInterval(function() {
    if (!document.hidden) loadOrders().catch(function(){});
  }, 60000);
})();
</script>
</body>
</html>
