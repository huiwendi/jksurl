<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>상품 선택기</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f5f5f5;color:#333}

.top-bar{background:#1e3a5f;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-bar h1{font-size:17px;white-space:nowrap}
.top-info{font-size:10px;opacity:.7;margin-left:auto;text-align:right;line-height:1.5}
.top-info .green{color:#5f5}
.customer-tag{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}

.search-sticky{position:sticky;top:0;z-index:99;background:#fff;padding:10px 14px;border-bottom:1px solid #eee;display:none;gap:6px;align-items:center}
.search-sticky input{flex:1;min-width:0;padding:8px 10px;border:2px solid #ddd;border-radius:8px;font-size:13px;outline:none}
.search-sticky input:focus{border-color:#2d6a9f}
.search-clear{width:30px;height:30px;border:none;border-radius:6px;background:#eee;color:#999;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.search-clear:hover{background:#e74c3c;color:#fff}
.search-sticky select{padding:8px 10px;border:2px solid #ddd;border-radius:8px;font-size:12px;background:#fff;max-width:110px}

.container{display:flex;min-height:calc(100vh - 54px)}
.product-area{flex:1;padding:12px;overflow-y:auto}

.cart-area{width:370px;min-width:370px;background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;max-height:calc(100vh - 54px);position:sticky;top:54px}
.cart-area h2{font-size:13px;padding:14px 16px 10px;color:#1e3a5f;border-bottom:2px solid #1e3a5f;margin:0}
.cart-list{flex:1;overflow-y:auto;padding:0 14px}
.cart-empty{text-align:center;color:#aaa;padding:40px 14px;font-size:12px}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.cart-item:last-child{border-bottom:none}
.cart-item-img{width:42px;height:42px;object-fit:contain;border-radius:4px;background:#fafafa;flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item-opt{font-size:10px;color:#888}
.cart-item-row{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.cart-item-price{font-weight:700;color:#e74c3c;font-size:13px}
.cart-item-qty{display:flex;align-items:center;gap:3px}
.cart-item-qty button{width:22px;height:22px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}
.cart-item-qty .qty{font-size:12px;font-weight:600;min-width:18px;text-align:center}
.cart-item-del{color:#e74c3c;cursor:pointer;font-size:11px;background:none;border:none}
.cart-total{padding:12px 14px;border-top:2px solid #1e3a5f;position:sticky;bottom:0;background:#fff}
.cart-total-row{display:flex;justify-content:space-between;font-size:13px;margin:3px 0}
.cart-total-row.total{font-size:17px;font-weight:700;color:#e74c3c;margin-top:5px}
.cart-actions{display:flex;gap:6px;margin-top:8px}
.cart-actions button{flex:1;padding:10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:none}
.btn-order{background:#2d6a9f;color:#fff}.btn-order:hover{background:#1e3a5f}
.btn-clear{background:#eee;color:#666}.btn-clear:hover{background:#ddd}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;cursor:pointer;transition:all .15s}
.card:hover{border-color:#2d6a9f;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card:active{transform:scale(.98)}
.card-img{width:100%;height:180px;object-fit:contain;background:#fafafa;display:block}
.card-img.placeholder{display:flex;align-items:center;justify-content:center;background:#f7f7f7;color:#ddd;font-size:38px}
.card-body{padding:9px 11px 12px}
.card-name{font-size:11px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.card-meta{font-size:9px;color:#888;margin:3px 0}
.card-stock{font-size:10px;margin:3px 0}
.card-price{font-size:12px;font-weight:700;color:#e74c3c;margin-top:3px}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;overflow-y:auto;padding:20px}
.modal-overlay.active{display:block}
.modal{background:#fff;border-radius:14px;max-width:620px;margin:20px auto;position:relative}
.modal-close{position:absolute;top:10px;right:14px;font-size:24px;color:#999;cursor:pointer;background:none;border:none;z-index:1}
.modal-close:hover{color:#333}
.modal-top{display:flex;gap:16px;padding:16px 16px 0}
.modal-img{width:180px;height:180px;object-fit:contain;background:#fafafa;border-radius:8px;flex-shrink:0}
.modal-img.placeholder{display:flex;align-items:center;justify-content:center;background:#f7f7f7;color:#ddd;font-size:48px}
.modal-header{flex:1}
.modal-name{font-size:16px;font-weight:700;margin-bottom:6px}
.modal-barcode{font-size:11px;color:#888;margin-bottom:4px}
.modal-total-stock{font-size:12px;color:#2d6a9f;font-weight:600}
.opt-list{padding:16px}
.opt-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px}
.opt-item:last-child{margin-bottom:0}
.opt-img{width:40px;height:40px;object-fit:contain;border-radius:4px;flex-shrink:0}
.opt-label{flex:1;font-size:12px;font-weight:600;min-width:120px}
.opt-price{font-size:13px;font-weight:700;color:#e74c3c;min-width:80px;text-align:right}
.opt-stock{font-size:11px;min-width:60px;text-align:center}
.opt-stock.none{color:#ccc}
.opt-stock.has{color:#27ae60}
.opt-qty{display:flex;align-items:center;gap:4px}
.opt-qty button{width:28px;height:28px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:14px}
.opt-qty button:disabled{opacity:.3;cursor:not-allowed}
.opt-qty .qty{font-size:14px;font-weight:600;min-width:24px;text-align:center}
.btn-add-opt{background:#2d6a9f;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.btn-add-opt:hover{background:#1e3a5f}
.btn-add-opt:disabled{background:#ccc;cursor:not-allowed}
.btn-add-opt.added{background:#27ae60;transform:scale(1.08);transition:all .15s}
.btn-add-opt.added::after{content:' ✓';font-size:13px}
@keyframes cartBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.cart-bounce{animation:cartBounce .3s ease}


.loading{text-align:center;padding:60px 20px;color:#888}
.spin{border:3px solid #eee;border-top:3px solid #2d6a9f;border-radius:50%;width:36px;height:36px;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 스켈레톤 플레이스홀더 (로딩 중) */
.skeleton-card{pointer-events:none}
.sk-img{width:100%;height:180px;background:#eee}
.sk-body{padding:9px 11px 12px}
.sk-line{height:10px;background:#eee;border-radius:4px;margin:6px 0}
.sk-line.short{width:60%}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.5}}
.skeleton-card .sk-img,.skeleton-card .sk-line{animation:skPulse 1.2s ease-in-out infinite}
.empty-state{text-align:center;padding:60px 20px;color:#aaa}
.empty-state .icon{font-size:48px;margin-bottom:10px}
.empty-state p{font-size:14px;margin:4px 0}
.empty-state .hint{font-size:12px;color:#ccc;margin-top:8px}

.cart-mobile{display:none;position:fixed;bottom:0;left:0;right:0;background:#1e3a5f;color:#fff;padding:10px 14px;z-index:100;align-items:center;gap:8px}
.cm-summary{flex:1;cursor:pointer}
.cm-label{font-size:11px;opacity:.7}
.cm-count{font-size:15px;font-weight:700}
.cm-total{font-size:13px;margin-left:8px}
.cm-btn{background:#27ae60;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.cm-clear{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cm-panel{display:none;position:fixed;bottom:52px;left:0;right:0;background:#fff;max-height:40vh;overflow-y:auto;z-index:99;border-top:1px solid #eee;padding:8px 14px}
.cm-panel.show{display:block}
.cp-empty{text-align:center;color:#aaa;padding:20px;font-size:12px}
.cm-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.cm-item-img{width:36px;height:36px;object-fit:contain;border-radius:4px}
.cm-item-info{flex:1;min-width:0}
.cm-item-name{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-item-opt{font-size:10px;color:#888}
.cm-item-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.cm-item-price{font-weight:700;color:#e74c3c;font-size:12px}
.cm-item-qty{display:flex;align-items:center;gap:3px}
.cm-item-qty button{width:22px;height:22px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}
.cm-item-qty .qty{font-size:12px;font-weight:600;min-width:16px;text-align:center}
.cm-item-del{color:#e74c3c;cursor:pointer;font-size:11px;margin-left:4px;background:none;border:none}

/* ===== 주문서 이메일 발송 ===== */
.btn-send{width:100%;background:#27ae60;color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-send:hover{background:#219150}
.btn-send:disabled{background:#9fd8b8;cursor:not-allowed}
.order-preview-actions{display:flex;gap:8px}
.order-preview-actions .btn-dl{flex:1;background:#eef2f6;color:#1e3a5f;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:600;cursor:pointer}
.order-preview-actions .btn-dl:hover{background:#e2e8f0}
.preview-note{font-size:11px;color:#888;line-height:1.7;margin:0 0 12px;background:#f7f8fa;border-radius:8px;padding:9px 11px}
.order-msg{font-size:12px;color:#e74c3c;margin-top:8px;min-height:16px;line-height:1.6}
.spinner-sm{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.order-success{padding:24px 20px;text-align:center}
.os-icon{font-size:44px;line-height:1}
.os-title{font-size:19px;font-weight:700;color:#1e3a5f;margin:6px 0 4px}
.os-sub{font-size:12px;color:#777;margin-bottom:16px}
.order-no-box{background:#f2f7fb;border:1px dashed #2d6a9f;border-radius:10px;padding:14px;margin-bottom:16px}
.order-no-label{font-size:10px;color:#888;letter-spacing:1px;margin-bottom:5px}
.order-no-value{font-size:21px;font-weight:800;color:#1e3a5f;letter-spacing:1px;word-break:break-all;font-family:Consolas,Menlo,monospace;user-select:all}
.btn-copy{margin-top:10px;background:#2d6a9f;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer}
.btn-copy:hover{background:#1e3a5f}
.btn-copy.ok{background:#27ae60}
.os-status{font-size:12px;color:#555;background:#f7f8fa;border-radius:8px;padding:10px 12px;text-align:left;line-height:1.7;margin-bottom:14px;word-break:break-all}
.os-status .ok{color:#27ae60;font-weight:600}
.os-status .warn{color:#e67e22;font-weight:600}
.os-actions{display:flex;gap:8px;flex-wrap:wrap}
.os-actions button{flex:1;padding:11px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;min-width:110px}
.os-close{background:#eef2f6;color:#555}
.os-dl{background:#f0f6ff;color:#1e3a5f}

@media(max-width:768px){
  .cart-area{display:none}
  .cart-mobile{display:flex}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card-img{height:140px}
  .sk-img{height:140px}
  .card-body{padding:7px 9px 10px}
  .card-name{font-size:10px;min-height:27px}
  .modal-top{flex-direction:column;align-items:center}
  .modal-img{width:140px;min-width:140px;height:140px}
  .modal-name{font-size:15px}
  .opt-item{flex-wrap:wrap;padding:8px;gap:6px}
  .opt-label{flex:1 1 100%;min-width:100%;white-space:normal;font-size:13px}
  .opt-price{font-size:12px;min-width:auto}
  .opt-stock{font-size:12px;min-width:auto}
  .opt-qty button{width:32px;height:32px}
  .btn-add-opt{padding:8px 14px}
}

@media(max-width:400px){
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .card-img{height:120px}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🎣 상품 선택기</h1>
  <div class="customer-tag" id="customerTag" style="display:none"></div>
  <div class="top-info" id="topInfo"></div>
</div>

<div class="search-sticky" id="searchSticky">
  <input type="text" id="searchInput" placeholder="검색: 바코드 또는 상품명..." onkeyup="doSearch()" autocomplete="off">
  <button class="search-clear" onclick="clearSearch()" title="지우기">✕</button>
  <select id="sortSelect" onchange="filterAndSort()">
    <option value="date-desc">등록일 최근순</option>
    <option value="name">이름순</option>
    <option value="stock-desc">재고↓</option>
    <option value="stock-asc">재고↑</option>
  </select>
</div>

<div class="container">
  <div class="product-area" id="productArea">
    <div class="loading" id="loading">
      <div class="spin"></div>
      <p>Google Sheets에서 재고 데이터를 불러오는 중...</p>
    </div>
  </div>

  <div class="cart-area" id="cartArea">
    <h2>🛒 주문 목록</h2>
    <div class="cart-list" id="cartList">
      <div class="cart-empty">상품을 선택해주세요</div>
    </div>
    <div class="cart-total" id="cartTotal" style="display:none">
      <div class="cart-total-row">품목 수 <span id="cartItemCount">0</span>개</div>
      <div class="cart-total-row total">합계 <span id="totalPrice">-</span></div>
      <div class="cart-actions">
        <button class="btn-order" onclick="previewOrder()">📋 주문서</button>
        <button class="btn-clear" onclick="clearCart()">비우기</button>
      </div>
    </div>
  </div>
</div>

<div class="cart-mobile" id="cartMobile" style="display:none">
  <div class="cm-summary" onclick="toggleCmPanel()">
    <div class="cm-label">🛒 주문</div>
    <div><span class="cm-count" id="cmCount">0</span><span class="cm-total" id="cmTotal"></span></div>
  </div>
  <button class="cm-btn" onclick="previewOrder()">📋 주문서</button>
  <button class="cm-clear" onclick="clearCart()">🗑️</button>
</div>
<div class="cm-panel" id="cmPanel">
  <div class="cp-empty">상품을 선택해주세요</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 주문서 미리보기 모달 -->
<div class="modal-overlay" id="orderPreviewModal">
  <div class="modal" style="max-width:560px">
    <button class="modal-close" onclick="closeOrderPreview()">×</button>
    <div id="orderPreviewContent"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="api-client.js"></script>
<script>
// ===== 로그인 확인 =====
(function(){
  var cdata = sessionStorage.getItem('customer');
  if (!cdata) { window.location.href = 'login.html'; return; }
  try { var c = JSON.parse(cdata); if (!c.name) { window.location.href = 'login.html'; } }
  catch(e) { window.location.href = 'login.html'; }
})();

// ===== 고객 정보 =====
let customerInfo = null;
try {
  var cdata = sessionStorage.getItem('customer');
  if(cdata) {
    customerInfo = JSON.parse(cdata);
    var tag = document.getElementById('customerTag');
    if(tag) { tag.textContent = '👤 '+customerInfo.name; tag.style.display = 'block'; }
  }
} catch(e) {}

// ===== 데이터 =====
let groups = [];
let filteredGroups = [];
let cart = [];

// ============ 从 Google Sheets 加载库存 ============
async function autoLoad() {
  ApiClient.init(); // config.js 의 CONFIG(API_URL, API_KEY) 사용
  renderSkeletons();
  loadOrderConfig();
  try {
    var data = await ApiClient.inventory.getGroups();
    if (data.success && data.groups && data.groups.length > 0) {
      groups = data.groups;
      filteredGroups = [...groups];
      document.getElementById('topInfo').innerHTML = '<span class="green">●</span> 서버 데이터 로드됨';
      document.getElementById('searchSticky').style.display = 'flex';
      filterAndSort();
    } else {
      showEmpty('서버에서 데이터를 불러오지 못했습니다');
    }
  } catch(e) {
    console.log('서버 로드 실패:', e);
    showEmpty('서버 연결 실패. 네트워크 상태를 확인해주세요');
  }
}

// 주문 메일 수신자 인원수 조회 (주소는 노출되지 않음)
function loadOrderConfig() {
  try {
    ApiClient.order.info().then(function(r) {
      if (r && r.success && r.recipientsCount) { mailRecipientsCount = r.recipientsCount; mailAvailable = true; }
    }).catch(function(){});
  } catch(e) {}
}

function renderSkeletons() {
  var html = '<div class="grid">';
  for (var i = 0; i < 8; i++) {
    html += '<div class="card skeleton-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line"></div></div></div>';
  }
  html += '</div>';
  document.getElementById('productArea').innerHTML = html;
}

function showEmpty(msg) {
  document.getElementById('productArea').innerHTML = '<div class="empty-state"><div class="icon">📁</div><p>'+msg+'</p></div>';
  document.getElementById('topInfo').textContent = '데이터 없음';
}

// ============ 搜索 ============
function doSearch() { filterAndSort(); }
function clearSearch() {
  document.getElementById('searchInput').value = '';
  filterAndSort();
}

function filterAndSort() {
  var q = document.getElementById('searchInput').value.trim();
  var sort = document.getElementById('sortSelect').value;

  if (!q) {
    filteredGroups = [...groups];
  } else {
    var qUpper = q.toUpperCase();
    filteredGroups = groups.filter(function(g) {
      if (g.name.toUpperCase().indexOf(qUpper) !== -1) return true;
      return g.options.some(function(o) {
        if (o.optName.toUpperCase().indexOf(qUpper) !== -1) return true;
        if (o.barcode && o.barcode.toUpperCase().indexOf(qUpper) !== -1) return true;
        return false;
      });
    });
  }

  if (sort === 'date-desc') {
    filteredGroups.sort(function(a,b) { return (b.regDate||'').localeCompare(a.regDate||''); });
  } else if (sort === 'stock-desc') {
    filteredGroups.sort(function(a,b) {
      var sa = a.options.reduce(function(s,o){return s+o.stock;},0);
      var sb = b.options.reduce(function(s,o){return s+o.stock;},0);
      return sb - sa;
    });
  } else if (sort === 'stock-asc') {
    filteredGroups.sort(function(a,b) {
      var sa = a.options.reduce(function(s,o){return s+o.stock;},0);
      var sb = b.options.reduce(function(s,o){return s+o.stock;},0);
      return sa - sb;
    });
  } else {
    filteredGroups.sort(function(a,b) { return a.name.localeCompare(b.name); });
  }
  renderGrid();
}

// ============ 渲染 ============
function renderGrid() {
  var area = document.getElementById('productArea');
  if (!groups.length) return;

  if (filteredGroups.length === 0) {
    area.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>검색 결과가 없습니다</p></div>';
    return;
  }

  var html = '<div class="grid">';
  html += filteredGroups.map(function(g) {
    var totalStock = g.options.reduce(function(s,o){return s+o.stock;},0);
    var stockDot = totalStock===0?'⚫':totalStock<=20?'🟡':'🟢';
    var imgHtml = g.image
      ? '<img class="card-img" src="'+esc(g.image)+'" loading="lazy" onerror="this.className=\'card-img placeholder\';this.textContent=\'📷\'">'
      : '<div class="card-img placeholder">📷</div>';
    var prices = g.options.filter(function(o){return o.price>0;}).map(function(o){return o.price;});
    var minPrice = prices.length ? Math.min.apply(null, prices) : Infinity;

    return '<div class="card" data-name="' + esc(g.name) + '">'+
      imgHtml+
      '<div class="card-body">'+

function changeModalQty(idx, delta) {
  var el = document.getElementById('mqty_'+idx);
  var v = parseInt(el.textContent)+delta;
  var stock = currentModalGroup ? (currentModalGroup.options[idx]?currentModalGroup.options[idx].stock:0) : 999;
  if(v<1)v=1;
  if(v>stock)v=stock;
  el.textContent=v;
}

function addOptToCart(btn, name, idx) {
  var g = groups.find(function(gg) { return gg.name===name; });
  if(!g)return;
  var o = g.options[idx];
  var qty = parseInt(document.getElementById('mqty_'+idx).textContent)||1;
  if(qty<=0||o.stock<=0)return;

  var exist = cart.findIndex(function(c) { return c.name===name && c.optName===o.optName; });
  var cartQty = exist>=0 ? cart[exist].qty : 0;
  if(cartQty + qty > o.stock) {
    alert('재고('+o.stock.toLocaleString()+'개)를 초과할 수 없습니다');
    return;
  }

  document.getElementById('mqty_'+idx).textContent=1;
  if(exist>=0) cart[exist].qty+=qty;
  else cart.push({name:name,optName:o.optName,price:o.price,barcode:o.barcode,skuCode:o.skuCode,image:o.image||g.image,qty:qty});
  if(btn){btn.classList.add('added');setTimeout(function(){btn.classList.remove('added');},600);}
  var cartEl=document.getElementById('cartArea');
  if(cartEl){cartEl.classList.add('cart-bounce');setTimeout(function(){cartEl.classList.remove('cart-bounce');},300);}
  updateCart();
}

// ============ 购物车 ============
function updateCart() {
  var list = document.getElementById('cartList');
  var total = document.getElementById('cartTotal');

  if (cart.length === 0) {
    list.innerHTML = '<div class="cart-empty">상품을 선택해주세요</div>';
    total.style.display = 'none';
    updateMobileCart();
    return;
  }
  total.style.display = 'block';

  var items = cart.reduce(function(s,c){return s+c.qty;},0);
  var price = cart.reduce(function(s,c){return s+(c.price||0)*c.qty;},0);
  document.getElementById('cartItemCount').textContent = items;
  document.getElementById('totalPrice').textContent = price>0?price.toLocaleString()+'원':'-';

  list.innerHTML = cart.map(function(c,i){
    var img=c.image?'<img class="cart-item-img" src="'+esc(c.image)+'" onerror="this.style.display=\'none\'">':'';
    var up=c.price||0;
    return '<div class="cart-item">'+img+'<div class="cart-item-info">'+
      '<div class="cart-item-name">'+esc(c.name)+'</div>'+
      (c.optName!=='(옵션없음)'?'<div class="cart-item-opt">'+esc(c.optName)+'</div>':'')+
      '<div class="cart-item-row">'+
        '<span class="cart-item-price">'+(up?up.toLocaleString()+'원':'')+'</span>'+
        '<div class="cart-item-qty">'+
          '<button onclick="cartQty('+i+',-1)">−</button>'+
          '<span class="qty">'+c.qty+'</span>'+
          '<button onclick="cartQty('+i+',1)">+</button>'+
          '<button class="cart-item-del" onclick="removeFromCart('+i+')">✕</button>'+
        '</div>'+
      '</div>'+
    '</div></div>';
  }).join('');
  updateMobileCart();
}

function cartQty(idx, delta) {
  var c = cart[idx];
  var g = groups.find(function(gg) { return gg.name === c.name; });
  var o = g ? g.options.find(function(oo) { return oo.optName === c.optName; }) : null;
  var max = o ? o.stock : 999;

  // 先检查上限再检查下限，避免库存0时数量变成0
  var newQty = c.qty + delta;
  if (newQty > max) {
    alert('재고('+max.toLocaleString()+'개)를 초과할 수 없습니다');
    c.qty = max;
  } else if (newQty < 1) {
    c.qty = 1;
  } else {
    c.qty = newQty;
  }
  updateCart();
}

function removeFromCart(idx) { cart.splice(idx,1); updateCart(); }
function clearCart() { if(confirm('주문 목록을 비우시겠습니까?')){cart=[];updateCart();} }

function makeFallbackOrderNo() {

  return 'JS'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+
         '-'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds())+rand;

// ezadmin 주문 업로드 양식과 동일한 컬럼 (기존 다운로드와 100% 동일)
function orderRows(orderNo) {
  var rows = [];
  rows.push(['주문번호','상품코드/매칭코드','상품명','옵션','바코드','단가','수량','금액',
             '수령자명','수령자전화번호','수령자핸드폰','수령자우편번호','수령자주소','배송메세지1']);

  cart.forEach(function(c) {
    var up = c.price || 0;
    rows.push([
      orderNo,
      c.skuCode || '',
      c.name,
      c.optName === '(옵션없음)' ? '' : c.optName,
      c.barcode || '',
      up > 0 ? up : '',
      c.qty,
      up > 0 ? up * c.qty : '',
      customerInfo ? customerInfo.name : '',
      customerInfo ? customerInfo.phone : '',
      customerInfo ? customerInfo.mobile : '',
      customerInfo ? customerInfo.zip : '',
      customerInfo ? customerInfo.address : '',
      customerInfo ? customerInfo.memo : ''
    ]);
  });
  return rows;
}

// xlsx 파일을 base64 문자열로 생성 (이메일 첨부 + 다운로드 공용)
function buildOrderFile(orderNo) {
  var rows = orderRows(orderNo);
  var safeName = ((customerInfo && customerInfo.name) ? customerInfo.name : '주문서').replace(/[\\/:*?"<>|]/g, '_');

  if (typeof XLSX === 'undefined') {
    var csv = rows.map(function(r) {
      return r.map(function(v) {
        var s = String(v == null ? '' : v);
        return s.indexOf(',') >= 0 || s.indexOf('"') >= 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    return {
      name: safeName + '_' + orderNo + '.csv',
      b64: btoa(unescape(encodeURIComponent('\uFEFF' + csv))),
      mime: 'text/csv;charset=utf-8'
    };
  }

  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    {wch:22},{wch:18},{wch:35},{wch:15},{wch:14},{wch:10},{wch:8},{wch:12},
    {wch:14},{wch:14},{wch:14},{wch:10},{wch:40},{wch:20}
  ];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '주문서');
  return {
    name: safeName + '_' + orderNo + '.xls',
    b64: XLSX.write(wb, { bookType: 'biff8', type: 'base64' }),
    mime: 'application/vnd.ms-excel'
  };
}

function b64ToBlob(b64, mime) {
  var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || 'application/octet-stream' });
}

function downloadFile(file) {
  if (!file || !file.b64) return;
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b64ToBlob(file.b64, file.mime));
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 2000);
}

// ============ 이메일 발송 ============
async function sendOrderEmail() {
  if (orderSending || !cart.length) return;
  orderSending = true;
  setSendBtnBusy(true, '주문번호 발급 중...');
  sendMsg('');

  try {
    var noRes = await ApiClient.order.nextNo();
    if (!noRes || !noRes.success) {
      if (noRes && (noRes.code === 'SESSION_EXPIRED' || noRes.code === 'NO_SESSION')) { showSessionExpired(); return; }
      throw new Error((noRes && noRes.error) || '주문번호를 발급받지 못했습니다');
    }
    var orderNo = noRes.orderNo;

    setSendBtnBusy(true, '주문서 준비 중...');
    var file = buildOrderFile(orderNo);

    var payload = {
      orderNo: orderNo,
      customer: customerInfo ? {
        name: customerInfo.name || '',
        phone: customerInfo.phone || '',
        mobile: customerInfo.mobile || '',
        zip: customerInfo.zip || '',
        address: customerInfo.address || '',
        memo: customerInfo.memo || ''
      } : {},
      items: cart.map(function(c) {
        return {
          name: c.name,
          optName: c.optName === '(옵션없음)' ? '' : c.optName,
          barcode: c.barcode || '',
          skuCode: c.skuCode || '',
          price: c.price || 0,
          qty: c.qty
        };
      }),
      file: { name: file.name, b64: file.b64 }
    };

    lastOrderFile = file;
    lastOrderPayload = payload;
    lastOrderNo = orderNo;

    setSendBtnBusy(true, '이메일 발송 중...');
    var res = await ApiClient.order.send(payload);

    if (res && res.success) {
      renderOrderSuccess(res, file);
      cart = [];
      updateCart();
      return;
    }
    if (res && (res.code === 'SESSION_EXPIRED' || res.code === 'NO_SESSION')) { showSessionExpired(); return; }
    throw new Error((res && res.error) || '이메일 발송에 실패했습니다');
  } catch (e) {
    var m = (e && e.message) ? e.message : '발송에 실패했습니다';
    sendMsg(m + ' — 잠시 후 다시 시도하거나 "엑셀만 다운로드"를 이용해주세요.');
  } finally {
    orderSending = false;
    setSendBtnBusy(false);
  }
}

function renderOrderSuccess(res, file) {
  var counts = res.counts || { ok: 1, fail: 0, total: 1 };
  var statusHtml = counts.fail > 0
    ? '<span class="warn">일부 수신자 전송 실패</span> — 성공 ' + counts.ok + ' / 전체 ' + counts.total +
      '<br>아래 파일을 담당자에게 직접 전달해주세요.'
    : '<span class="ok">✔ ' + counts.ok + '명에게 이메일 발송 완료</span>';

  var html = '<div class="order-success">'+
    '<div class="os-icon">✅</div>'+
    '<div class="os-title">주문이 접수되었습니다</div>'+
    '<div class="os-sub">아래 주문번호를 복사해 두세요. 담당자가 확인 후 연락드립니다.</div>'+
    '<div class="order-no-box">'+
      '<div class="order-no-label">ORDER NO. / 주문번호</div>'+
      '<div class="order-no-value" id="finalOrderNo">'+esc(res.orderNo)+'</div>'+
      '<button class="btn-copy" id="btnCopyNo" onclick="copyOrderNo()">주문번호 복사</button>'+
    '</div>'+
    '<div class="os-status">'+statusHtml+'<br>첨부파일: '+esc(file.name)+' (ezadmin 업로드용)</div>'+
    '<div class="os-actions">'+
      (counts.fail > 0 ? '<button class="os-dl" onclick="retryOrderMail()">🔄 다시 발송</button>' : '')+
      '<button class="os-dl" onclick="downloadLastFile()">📥 파일 다시 받기</button>'+
      '<button class="os-close" onclick="closeOrderPreview()">닫기</button>'+
    '</div>'+
  '</div>';

  document.getElementById('orderPreviewContent').innerHTML = html;
}

function copyOrderNo() {
  var no = lastOrderNo || '';
  var btn = document.getElementById('btnCopyNo');
  function done(ok) {
    if (!btn) return;
    btn.textContent = ok ? '복사됨 ✓' : '복사 실패 — 길게 눌러 선택';
    btn.className = 'btn-copy' + (ok ? ' ok' : '');
    if (ok) setTimeout(function(){ btn.textContent = '주문번호 복사'; btn.className = 'btn-copy'; }, 2000);
  }
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = no;
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch(e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(no).then(function(){ done(true); }, fallback);
  } else {
    fallback();
  }
}

async function retryOrderMail() {
  if (orderSending || !lastOrderPayload) return;
  orderSending = true;
  var msgEl = document.querySelector('.os-status');
  var oldHtml = msgEl ? msgEl.innerHTML : '';
  if (msgEl) msgEl.innerHTML = '<span class="warn">재발송 중...</span>';

  try {
    var payload = Object.assign({}, lastOrderPayload);
    payload.resend = true;
    var res = await ApiClient.order.send(payload);
    if (res && res.success) {
      renderOrderSuccess(res, lastOrderFile);
    } else {
      if (msgEl) msgEl.innerHTML = oldHtml;
      alert((res && res.error) || '재발송에 실패했습니다');
    }
  } catch(e) {
    if (msgEl) msgEl.innerHTML = oldHtml;
    alert('재발송 실패: ' + ((e && e.message) || e));
  } finally {
    orderSending = false;
  }
}

function downloadLastFile() {
  downloadFile(lastOrderFile);
}

// 이메일 없이 엑셀만 받는 안전장치
function downloadPreviewFile() {
  var no = lastOrderNo || makeFallbackOrderNo();
  downloadFile(buildOrderFile(no));
}

// ============ 工具 ============
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
document.getElementById('orderPreviewModal').addEventListener('click', function(e) { if(e.target===this) closeOrderPreview(); });

// ============ 이벤트 위임 (XSS 방지) ============
// 상품 카드 클릭 → 모달 열기
document.getElementById('productArea').addEventListener('click', function(e) {
  var card = e.target.closest('.card[data-name]');
  if (card) openModal(card.getAttribute('data-name'));
});
// 옵션 담기 버튼 → 장바구니 추가
document.getElementById('modalContent').addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-add-opt[data-name]');
  if (btn) {
    var name = btn.getAttribute('data-name');
    var idx = parseInt(btn.getAttribute('data-idx'));
    addOptToCart(btn, name, idx);
  }
});

// ============ 启动 ============
window.addEventListener('resize', function() { updateMobileCart(); });
autoLoad();
</script>
